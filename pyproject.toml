[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-scanner"
version = "0.1.0"
description = "Defensive security scanner and log analyzer for the Sentinel platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "rich>=15.0.0",
  "jinja2>=3.1",
  "fpdf2>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "trustme>=1.2.1",
]

[project.scripts]
sentinel-scan = "sentinel_scanner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_scanner"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: likely bugs, UP: modern syntax,
# S: security (bandit) rules, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
# Finding titles/descriptions are long human-readable sentences; the formatter still wraps code.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are how pytest tests work

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
